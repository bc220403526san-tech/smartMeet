version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartmeet-app
    restart: unless-stopped
    working_dir: /var/www/html

    env_file:
      - .env.docker

    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306

      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http

    volumes:
      - ./:/var/www/html

    depends_on:
      db:
        condition: service_healthy

    networks:
      - smartmeet


  web:
    image: nginx:latest
    container_name: smartmeet-web
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app
      - reverb

    networks:
      - smartmeet


  db:
    image: mysql:8.0
    container_name: smartmeet-db
    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - smartmeet_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - smartmeet


  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartmeet-reverb
    restart: unless-stopped
    working_dir: /var/www/html

    command: php artisan reverb:start --host=0.0.0.0 --port=8080

    env_file:
      - .env.docker

    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306

      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080

    volumes:
      - ./:/var/www/html

    depends_on:
      db:
        condition: service_healthy

    networks:
      - smartmeet


  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartmeet-queue
    restart: unless-stopped
    working_dir: /var/www/html

    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90

    env_file:
      - .env.docker

    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306

    volumes:
      - ./:/var/www/html

    depends_on:
      db:
        condition: service_healthy

    networks:
      - smartmeet


  coturn:
    image: coturn/coturn:latest
    container_name: smartmeet-coturn
    restart: unless-stopped

    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM}
      - --user=${TURN_USERNAME}:${TURN_PASSWORD}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200

    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

    networks:
      - smartmeet


volumes:
  smartmeet_mysql_data:


networks:
  smartmeet:
    driver: bridge
